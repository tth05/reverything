# cargo-about configuration for THIRD-PARTY-NOTICES.html, the licenses of the libraries in the
# released binaries. Generated by scripts\build-installer.ps1 (and so by the release workflow):
#   cargo about generate about.hbs -o THIRD-PARTY-NOTICES.html

# Only what ships: the Windows build, without build and dev dependencies
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Our own crates are covered by LICENSE
private = { ignore = true }

accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "OFL-1.1",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "NCSA",
    "0BSD",
    "bzip2-1.0.6",
]
