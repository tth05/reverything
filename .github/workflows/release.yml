name: Release

# Push a tag matching the version in Cargo.toml, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# Without a tag (manual run) the installer is only uploaded as a build artifact.
#
# After publishing the release, this also updates the Scoop bucket (bucket/reverything.json on
# master) and, once the WINGET_TOKEN secret exists, opens the pull request for winget. Both run
# here and not in workflows started by the release: releases created with the workflow's token
# do not start other workflows.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-2022
    env:
      # Whether the winget step can run, without exposing the token to every step
      HAS_WINGET_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist
      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match the version $version in Cargo.toml"
          }
      # Generates the third-party licenses shipped with the app
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      # Fat LTO and a single codegen unit, see the dist profile in Cargo.toml
      - name: Build the installer
        shell: pwsh
        run: scripts/build-installer.ps1 -Profile dist
      # The app's updater only runs an installer that matches this checksum
      - name: Checksum
        shell: pwsh
        run: |
          foreach ($file in Get-Item target/installer/*.exe) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            Set-Content "$($file.FullName).sha256" "$hash  $($file.Name)" -NoNewline
          }
      # winget and Scoop manifests with the installer's URL and checksum, see the README
      - name: Package manager manifests
        shell: pwsh
        run: |
          $installer = Get-Item target/installer/*.exe
          $version = $installer.BaseName -replace '^reverything-setup-', ''
          scripts/update-manifests.ps1 -Version $version -Installer $installer.FullName
          Compress-Archive packaging/winget/manifests "target/installer/winget-manifests-$version.zip"
          Copy-Item bucket/reverything.json target/installer/scoop-reverything.json
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: target/installer/*
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-Item target/installer/*).FullName `
            --title "Reverything ${{ github.ref_name }}" --generate-notes
      # Scoop users get the new version from this repository, which is their bucket
      - name: Update the Scoop bucket
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          # The manifests step left generated files behind, master may track them
          Remove-Item -Recurse -Force bucket, packaging -ErrorAction SilentlyContinue
          git fetch --depth 1 origin master
          git checkout -B master origin/master
          New-Item -ItemType Directory -Force bucket | Out-Null
          Copy-Item target/installer/scoop-reverything.json bucket/reverything.json
          git add bucket/reverything.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'Scoop manifest unchanged'; exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update the Scoop manifest to ${{ github.ref_name }}"
          git push origin master
      # Opens a pull request to microsoft/winget-pkgs from the fork of the WINGET_TOKEN owner,
      # based on the previous version there (the first version is submitted by hand)
      - name: Publish to winget
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_WINGET_TOKEN == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: tth05.Reverything
          installers-regex: 'reverything-setup-.*\.exe$'
          release-tag: ${{ github.ref_name }}
          token: ${{ secrets.WINGET_TOKEN }}
