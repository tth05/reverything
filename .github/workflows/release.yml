name: Release

# Push a tag matching the version in Cargo.toml, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
# Without a tag (manual run) the installer is only uploaded as a build artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist
      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match the version $version in Cargo.toml"
          }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      # Fat LTO and a single codegen unit, see the dist profile in Cargo.toml
      - name: Build the installer
        shell: pwsh
        run: scripts/build-installer.ps1 -Profile dist
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: target/installer/*.exe
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-Item target/installer/*.exe).FullName `
            --title "Reverything ${{ github.ref_name }}" --generate-notes
