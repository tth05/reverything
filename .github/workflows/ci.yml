name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # GPUI compiles its shaders with fxc.exe, its build script does not always find it
      - name: Locate fxc.exe
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --release -- -D warnings
      - run: cargo test --workspace --release
