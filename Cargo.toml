[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.1.0"
edition = "2021"

[workspace.dependencies]
reverything-core = { path = "crates/reverything-core" }
reverything-protocol = { path = "crates/reverything-protocol" }
windows = { version = "0.62.2", default-features = false, features = ["std"] }
eyre = "0.6.14"
rayon = "1.12.0"
fixedbitset = "0.5.7"
memchr = "2.8.3"
mimalloc = "0.1.52"
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }
log = { version = "0.4.34", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

# Slow to compile, only used for release builds on CI and the installer
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
